
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PetCare</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f7f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 5px 20px #00000012;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #4caf9c;
      font-size: 32px;
    }

    .logo p {
      color: #777;
      margin-top: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #263238;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #4caf9c;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4caf9c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #328b7b;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #328b7b;
      text-decoration: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #328b7b;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>🐾 PetCare</h1>
      <p>Seu pet merece todo cuidado!</p>
    </div>

    <h2>Entrar na sua conta</h2>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        required
      >

      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        required
      >

      <button type="submit">Entrar</button>

      <p class="message" id="mensagem"></p>

    </form>

    <div class="links">
      <p>Não tem uma conta?</p>
      <a href="cadastro.html">Criar cadastro</a>
      <br>
      <a href="index.html">Voltar ao início</a>
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("mensagem").textContent =
        "Tela criada! O login será conectado à API.";
    });
  </script>

</body>
</html>
