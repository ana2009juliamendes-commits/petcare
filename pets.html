
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pets - PetCare</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f7f5;
      color: #263238;
    }

    header {
      background: #4caf9c;
      color: white;
      padding: 25px;
      text-align: center;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: #328b7b;
      text-decoration: none;
      margin: 10px;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px #00000010;
    }

    h2 {
      color: #328b7b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 16px;
      background: white;
    }

    button {
      background: #4caf9c;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #328b7b;
    }

    .pet-card {
      background: #f5f9f8;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .pet-card h3 {
      color: #328b7b;
      margin-bottom: 8px;
    }

    #mensagem {
      margin-top: 15px;
      color: #328b7b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 PetCare</h1>
    <p>Gerenciamento dos seus animais</p>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="login.html">Entrar</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="pets.html">Pets</a>
  </nav>

  <main>

    <section class="container">
      <h2>Cadastrar novo pet</h2>

      <form id="petForm">

        <label for="nome">Nome do pet</label>
        <input
          type="text"
          id="nome"
          placeholder="Ex: Mel"
          required
        >

        <label for="especie">Espécie</label>
        <select id="especie" required>
          <option value="">Selecione</option>
          <option value="Cachorro">Cachorro</option>
          <option value="Gato">Gato</option>
          <option value="Ave">Ave</option>
          <option value="Outro">Outro</option>
        </select>

        <label for="raca">Raça</label>
        <input
          type="text"
          id="raca"
          placeholder="Ex: Poodle"
        >

        <label for="idade">Idade</label>
        <input
          type="number"
          id="idade"
          min="0"
          placeholder="Idade em anos"
          required
        >

        <label for="sexo">Sexo</label>
        <select id="sexo" required>
          <option value="">Selecione</option>
          <option value="Macho">Macho</option>
          <option value="Fêmea">Fêmea</option>
        </select>

        <button type="submit">Cadastrar pet</button>

        <p id="mensagem"></p>

      </form>
    </section>

    <section class="container">
      <h2>Meus pets</h2>

      <div id="listaPets">
        <p>Os pets cadastrados aparecerão aqui.</p>
      </div>
    </section>

  </main>

  <footer>
    <p>PetCare © 2026 - Projeto Final</p>
  </footer>

  <script>
    document.getElementById("petForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const nome = document.getElementById("nome").value;
      const especie = document.getElementById("especie").value;
      const raca = document.getElementById("raca").value;
      const idade = document.getElementById("idade").value;
      const sexo = document.getElementById("sexo").value;

      const card = document.createElement("div");
      card.className = "pet-card";

      const titulo = document.createElement("h3");
      titulo.textContent = "🐾 " + nome;

      const detalhes = document.createElement("p");
      detalhes.textContent =
        especie + " | " + raca + " | " + idade +
        " ano(s) | " + sexo;

      card.appendChild(titulo);
      card.appendChild(detalhes);

      const lista = document.getElementById("listaPets");

      if (lista.querySelector("p")) {
        lista.innerHTML = "";
      }

      lista.appendChild(card);

      document.getElementById("mensagem").textContent =
        "Pet adicionado à lista de demonstração!";

      document.getElementById("petForm").reset();
    });
  </script>

</body>
</html>
