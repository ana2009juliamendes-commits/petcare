
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas - PetCare</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f7f5;
      color: #263238;
    }

    header {
      background: #4caf9c;
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: #328b7b;
      text-decoration: none;
      margin: 8px;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px #00000010;
    }

    h2 {
      color: #328b7b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 16px;
      background: white;
    }

    textarea {
      resize: vertical;
    }

    button {
      background: #4caf9c;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .consulta-card {
      background: #f5f9f8;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .consulta-card h3 {
      color: #328b7b;
      margin-bottom: 10px;
    }

    .consulta-card p {
      margin-bottom: 6px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 PetCare</h1>
    <p>Consultas veterinárias</p>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="pets.html">Pets</a>
    <a href="consultas.html">Consultas</a>
    <a href="login.html">Entrar</a>
  </nav>

  <main>

    <section class="container">
      <h2>Agendar consulta</h2>

      <form id="consultaForm">

        <label for="pet">Nome do pet</label>
        <input
          type="text"
          id="pet"
          placeholder="Digite o nome do pet"
          required
        >

        <label for="veterinario">Veterinário</label>
        <input
          type="text"
          id="veterinario"
          placeholder="Nome do veterinário"
          required
        >

        <label for="data">Data</label>
        <input
          type="date"
          id="data"
          required
        >

        <label for="horario">Horário</label>
        <input
          type="time"
          id="horario"
          required
        >

        <label for="motivo">Motivo da consulta</label>
        <textarea
          id="motivo"
          rows="3"
          placeholder="Ex: vacinação, avaliação..."
          required
        ></textarea>

        <button type="submit">Agendar consulta</button>

      </form>
    </section>

    <section class="container">
      <h2>Consultas agendadas</h2>

      <div id="listaConsultas">
        <p>Nenhuma consulta cadastrada.</p>
      </div>
    </section>

  </main>

  <footer>
    <p>PetCare © 2026 - Projeto Final</p>
  </footer>

  <script>
    const formulario = document.getElementById("consultaForm");

    formulario.addEventListener("submit", function(event) {
      event.preventDefault();

      const pet = document.getElementById("pet").value;
      const veterinario = document.getElementById("veterinario").value;
      const data = document.getElementById("data").value;
      const horario = document.getElementById("horario").value;
      const motivo = document.getElementById("motivo").value;

      const card = document.createElement("div");
      card.className = "consulta-card";

      const titulo = document.createElement("h3");
      titulo.textContent = "🐾 Consulta de " + pet;

      const detalhes = document.createElement("p");
      detalhes.textContent = "Veterinário: " + veterinario;

      const dataConsulta = document.createElement("p");
      dataConsulta.textContent = "Data: " + data + " às " + horario;

      const motivoConsulta = document.createElement("p");
      motivoConsulta.textContent = "Motivo: " + motivo;

      card.appendChild(titulo);
      card.appendChild(detalhes);
      card.appendChild(dataConsulta);
      card.appendChild(motivoConsulta);

      const lista = document.getElementById("listaConsultas");

      if (lista.querySelector("p")) {
        lista.innerHTML = "";
      }

      lista.appendChild(card);

      formulario.reset();
    });
  </script>

</body>
</html>
