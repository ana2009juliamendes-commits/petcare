
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidados - PetCare</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f7f5;
      color: #263238;
    }

    header {
      background: #4caf9c;
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: #328b7b;
      text-decoration: none;
      margin: 8px;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px #00000010;
    }

    h2 {
      color: #328b7b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 16px;
      background: white;
    }

    button {
      background: #4caf9c;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .cuidado-card {
      background: #f5f9f8;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .cuidado-card h3 {
      color: #328b7b;
      margin-bottom: 10px;
    }

    .cuidado-card p {
      margin-bottom: 6px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐾 PetCare</h1>
    <p>Cuidados e saúde dos seus pets</p>
  </header>

  <nav>
    <a href="index.html">Início</a>
    <a href="pets.html">Pets</a>
    <a href="consultas.html">Consultas</a>
    <a href="cuidados.html">Cuidados</a>
  </nav>

  <main>

    <section class="container">
      <h2>Registrar cuidado</h2>

      <form id="cuidadoForm">

        <label for="pet">Nome do pet</label>
        <input
          type="text"
          id="pet"
          placeholder="Digite o nome do pet"
          required
        >

        <label for="tipo">Tipo de cuidado</label>
        <select id="tipo" required>
          <option value="">Selecione</option>
          <option value="Vacinação">Vacinação</option>
          <option value="Vermifugação">Vermifugação</option>
          <option value="Banho">Banho</option>
          <option value="Medicação">Medicação</option>
          <option value="Outro">Outro</option>
        </select>

        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          rows="3"
          placeholder="Descreva o cuidado realizado"
          required
        ></textarea>

        <label for="data">Data do cuidado</label>
        <input
          type="date"
          id="data"
          required
        >

        <label for="proximaData">Próxima data (opcional)</label>
        <input
          type="date"
          id="proximaData"
        >

        <button type="submit">Registrar cuidado</button>

      </form>
    </section>

    <section class="container">
      <h2>Histórico de cuidados</h2>

      <div id="listaCuidados">
        <p>Nenhum cuidado registrado.</p>
      </div>
    </section>

  </main>

  <footer>
    <p>PetCare © 2026 - Projeto Final</p>
  </footer>

  <script>
    document.getElementById("cuidadoForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const pet = document.getElementById("pet").value;
      const tipo = document.getElementById("tipo").value;
      const descricao = document.getElementById("descricao").value;
      const data = document.getElementById("data").value;
      const proximaData = document.getElementById("proximaData").value;

      const card = document.createElement("div");
      card.className = "cuidado-card";

      const titulo = document.createElement("h3");
      titulo.textContent = "🐾 " + pet + " - " + tipo;

      const detalhe = document.createElement("p");
      detalhe.textContent = "Descrição: " + descricao;

      const dataCuidado = document.createElement("p");
      dataCuidado.textContent = "Data: " + data;

      card.appendChild(titulo);
      card.appendChild(detalhe);
      card.appendChild(dataCuidado);

      if (proximaData) {
        const proxima = document.createElement("p");
        proxima.textContent = "Próxima data: " + proximaData;
        card.appendChild(proxima);
      }

      const lista = document.getElementById("listaCuidados");

      if (lista.querySelector("p")) {
        lista.innerHTML = "";
      }

      lista.appendChild(card);

      document.getElementById("cuidadoForm").reset();
    });
  </script>

</body>
</html>
